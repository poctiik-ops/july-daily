<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>July Daily</title>
<meta name="description" content="Личный планер: задачи по дням, встречи, цели на месяц и год.">
<meta name="theme-color" content="#F4EEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14112A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="July Daily">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="stars"></div>
</div>
<div id="app">
  <header id="top"></header>
  <main id="main" class="scroll"></main>
  <div id="assist-card" aria-live="polite"></div>
  <footer id="dock">
    <form id="ask" class="glass" autocomplete="off">
      <span class="ask-spark"></span>
      <label for="ask-input" class="sr">Помощник</label>
      <input id="ask-input" type="text" enterkeyhint="send" placeholder="Скажи или напиши…">
      <button type="button" id="ask-btn" class="ask-btn" aria-label="Голосовой ввод"></button>
    </form>
    <p id="ask-hint">Нажми 🎙 на клавиатуре и говори</p>
    <div class="dock-row">
      <nav id="tabs" class="glass" aria-label="Разделы"></nav>
      <button type="button" id="plus" class="glass round" aria-label="Добавить"></button>
    </div>
  </footer>
  <div id="sheets"></div>
  <div id="toast" role="status"></div>
</div>
<noscript>Для работы July Daily нужен JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
